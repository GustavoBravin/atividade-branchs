<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Projeto Simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Meu Projeto Simples</h1>
    <p>Um site básico feito com HTML, CSS e JavaScript</p>
  </header>

  <main>
    <section class="galeria">
      <h2>Galeria de imagens</h2>
      <div class="cards">
        <div class="card">
          <img src="img/foto1.png" alt="Imagem 1 - gradiente roxo">
          <p>Imagem 1</p>
        </div>
        <div class="card">
          <img src="img/foto2.png" alt="Imagem 2 - gradiente verde e azul">
          <p>Imagem 2</p>
        </div>
        <div class="card">
          <img src="img/foto3.png" alt="Imagem 3 - gradiente vermelho e laranja">
          <p>Imagem 3</p>
        </div>
      </div>
    </section>

    <section class="interativo">
      <h2>Contador</h2>
      <p>Clique no botão para testar o JavaScript:</p>
      <button id="btnContador">Cliquei <span id="contador">0</span> vezes</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Meu Projeto Simples. Feito para praticar Git e GitHub.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
